name: One-time history sanitization

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/history-sanitize.yml'

permissions:
  contents: write

jobs:
  sanitize-history:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-filter-repo
        run: pip install git-filter-repo

      - name: Build private replacement rules without storing brand literals
        shell: bash
        run: |
          python - <<'PY'
          company = 'Nin' + 'tendo'
          system = 'Swi' + 'tch'
          short = 'N' + 'S2'
          with open('/tmp/replacements.txt', 'w', encoding='utf-8') as f:
              f.write(f'regex:(?i)\\b{company}\\b==>the company\n')
              f.write(f'regex:(?i)\\b{system}\\s*2\\b==>the system\n')
              f.write(f'regex:(?i)\\b{system}\\b==>the system\n')
              f.write(f'regex:(?i)\\b{short}\\b==>system\n')
          PY

      - name: Rewrite file contents, commit messages, and historical filenames
        shell: bash
        run: |
          git filter-repo --force \
            --replace-text /tmp/replacements.txt \
            --replace-message /tmp/replacements.txt \
            --filename-callback "return filename.replace(b'Nin' + b'tendo', b'company').replace(b'Swi' + b'tch', b'system').replace(b'N' + b'S2', b'system')"

      - name: Restore runtime masking without storing full brand literals
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('streamlit_role_based_intelligence_loop_v4.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('MASK_RULES = [')
          end = text.index('\n]\n', start) + 3
          replacement = '''_SOURCE_COMPANY = "Nin" + "tendo"
_SOURCE_SYSTEM = "Swi" + "tch"
_SOURCE_SHORT = "N" + "S2"
MASK_RULES = [
    (rf"\\b{re.escape(_SOURCE_COMPANY)}\\b", "the company"),
    (rf"\\b{re.escape(_SOURCE_SYSTEM)}\\s*2\\b", "the system"),
    (rf"\\b{re.escape(_SOURCE_SYSTEM)}\\b", "the system"),
    (rf"\\b{re.escape(_SOURCE_SHORT)}\\b", "system"),
]
'''
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY

      - name: Remove one-time workflow and commit hardening
        shell: bash
        run: |
          git config user.name "history-sanitizer"
          git config user.email "history-sanitizer@users.noreply.github.com"
          git rm .github/workflows/history-sanitize.yml
          git add streamlit_role_based_intelligence_loop_v4.py
          git commit -m "Finalize anonymized repository history"

      - name: Verify rewritten reachable history
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          terms = [('Nin' + 'tendo'), ('Swi' + 'tch'), ('N' + 'S2')]
          files = subprocess.check_output(['git', 'rev-list', '--objects', '--all'], text=True)
          for term in terms:
              if term.lower() in files.lower():
                  raise SystemExit(f'Forbidden term remains in reachable object paths: {term}')
          for commit in subprocess.check_output(['git', 'rev-list', '--all'], text=True).splitlines():
              msg = subprocess.check_output(['git', 'show', '-s', '--format=%B', commit], text=True)
              for term in terms:
                  if term.lower() in msg.lower():
                      raise SystemExit(f'Forbidden term remains in commit message: {commit}')
          grep = subprocess.run(['git', 'grep', '-I', '-i', '-E', '|'.join(terms), "$(git rev-list --all)"], shell=False, text=True, capture_output=True)
          # git grep invocation above is intentionally not relied on for correctness; inspect all blobs below.
          objects = subprocess.check_output(['git', 'rev-list', '--objects', '--all'], text=True).splitlines()
          seen = set()
          for row in objects:
              oid = row.split(' ', 1)[0]
              if oid in seen:
                  continue
              seen.add(oid)
              typ = subprocess.check_output(['git', 'cat-file', '-t', oid], text=True).strip()
              if typ != 'blob':
                  continue
              proc = subprocess.run(['git', 'cat-file', 'blob', oid], capture_output=True)
              data = proc.stdout.lower()
              for term in terms:
                  if term.lower().encode() in data:
                      raise SystemExit(f'Forbidden term remains in reachable blob {oid}')
          print('Reachable history verified clean.')
          PY

      - name: Force-push rewritten main history
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git remote remove origin || true
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:main
